<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - FlashLearn</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/responsive.css">
  <style>
    .profile-container {
      max-width: 600px;
      margin: 3rem auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    .profile-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #4f46e5;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 auto 1rem auto;
    }
    .profile-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin: 1.5rem 0;
      text-align: center;
    }
    .stat-badge {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
    }
    .stat-badge h4 {
      font-size: 1.5rem;
      color: #4f46e5;
      margin-bottom: 0.25rem;
    }
    .stat-badge p {
      color: #64748b;
      font-size: 0.875rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #334155;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
    }
    .form-group input:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }
    .toast-msg {
      background: #10b981;
      color: white;
      padding: 0.75rem;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar">
      <div class="nav-brand">
        <h2><a href="dashboard.html" style="text-decoration: none; color: inherit;">⚡ FlashLearn</a></h2>
      </div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html" class="active" style="font-weight: 600; color: #4f46e5;">Profile</a>
        <a href="#" id="navAuthLink" onclick="handleLogout()">Logout</a>
      </div>
    </nav>
  </header>

  <!-- Main Profile Card -->
  <main class="container">
    <div class="profile-container">
      <div class="profile-header">
        <div class="profile-avatar" id="avatarInitial">U</div>
        <h2 id="profileDisplayName">User Name</h2>
        <p id="profileRoleText" style="color: #64748b; font-size: 0.9rem;">Learner Account</p>
      </div>

      <div id="profileToast" class="toast-msg">Profile updated successfully!</div>

      <!-- Quick Stats -->
      <div class="profile-stats-grid">
        <div class="stat-badge">
          <h4 id="userCardsReviewed">0</h4>
          <p>Cards Reviewed</p>
        </div>
        <div class="stat-badge">
          <h4 id="userStreak">0 Days</h4>
          <p>Current Streak</p>
        </div>
      </div>

      <!-- Profile Form -->
      <form id="profileForm" onsubmit="handleUpdateProfile(event)">
        <div class="form-group">
          <label for="profileEmail">Email Address (Read-only)</label>
          <input type="email" id="profileEmail" disabled>
        </div>

        <div class="form-group">
          <label for="profileNameInput">Full Name</label>
          <input type="text" id="profileNameInput" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
          Save Changes
        </button>
      </form>
    </div>
  </main>

  <script src="JS/profile.js"></script>
</body>
</html>
