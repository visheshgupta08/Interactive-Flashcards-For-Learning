<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup - FlashLearn</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar">
      <div class="logo">⚡ FlashLearn</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="study.html">Study</a></li>
        <li><a href="auth.html" class="active">Login</a></li>
      </ul>
    </nav>
  </header>

  <!-- Auth Card Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button id="loginTabBtn" class="tab-btn active" onclick="showLogin()" type="button">Login</button>
        <button id="signupTabBtn" class="tab-btn" onclick="showSignup()" type="button">Sign Up</button>
      </div>

      <!-- Alert Message Box -->
      <div id="authMessage" class="auth-msg"></div>

      <!-- Login Form Container -->
      <div id="loginForm" class="form-container">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Log in to track your learning progress</p>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="student@example.com" required>
          </div>

          <div class="form-group">
            <label for="loginPass">Password</label>
            <input type="password" id="loginPass" placeholder="Enter password" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
      </div>

      <!-- Sign Up Form Container (Default Hidden) -->
      <div id="signupForm" class="form-container hidden">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join FlashLearn to master your subjects</p>

        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="Your Name" required>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="student@example.com" required>
          </div>

          <div class="form-group">
            <label for="signupPass">Password</label>
            <input type="password" id="signupPass" placeholder="At least 6 characters" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
      </div>

    </div>
  </main>

  <footer>
    <p>Developed by Team <strong>WebNova</strong> | CSE326 CA1 Project</p>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
